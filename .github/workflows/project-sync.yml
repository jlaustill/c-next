# Keeps the cnx project board in step with issue and PR events (Issue #1247).
#
# GitHub has no built-in workflow for "pull request opened", and none for
# "issue assigned" or "issue unassigned", so those three transitions live here.
# What the built-ins do well -- item closed, pull request merged -- is left to
# them and is absent from this file.
#
# Unassigning is how a card is PAUSED: picked up, found blocked, set down with
# nothing committed. `WIP` means "this is actively being worked on" -- the
# option's own description -- so a paused card must not sit there. Until #1572
# no transition moved one back, and #1448 read as active work for 9h52m after
# its work stopped. Unassigning is now the whole gesture; the board follows.
#
# PR reopening is handled here rather than by the built-in "Item reopened", which
# fires on issues and pull requests alike: it would send a reopened PR to Backlog
# while this workflow sends it to PR Review, and which one lands is a race. One
# owner per transition. See docs/WORKFLOW.md.
#
# ISSUE reopening is deliberately unhandled. Reopening a closed issue is not a
# supported transition on this project -- a defect found after a fix shipped is a
# NEW issue, with its own reproduction, not a resurrected one. So this workflow
# does not subscribe to `issues.reopened` and does not move the card, which leaves
# a reopened issue visibly stranded in Done rather than quietly re-entering the
# pipeline. That inconsistency is the point: it is how the policy violation
# surfaces. See docs/WORKFLOW.md.
#
# GITHUB_TOKEN is scoped to the repository and cannot write Projects v2, so this
# mints a short-lived token from the smeltworks board GitHub App (#2189). The
# app holds the organization Projects permission, which no repository token
# has. BOARD_APP_ID is an organization variable and BOARD_APP_PRIVATE_KEY an
# organization secret, so nothing here expires or belongs to one person. Until
# #2189 this was PROJECT_TOKEN, a classic PAT whose per-repository copies
# expired unnoticed (smeltworks/vscode-cnx#14).
#
# `workflow_call` lets smeltworks/vscode-cnx reuse this file rather than copy
# it -- a reusable workflow sees the caller's event context, so the same logic
# serves both repositories from one source. A called workflow reads the
# CALLER's variables, so BOARD_APP_ID resolves from the organization either
# way; the private key is a secret, and secrets must be passed in.
#
# PROJECT_OWNER and PROJECT_NUMBER below restate ProjectBoard.OWNER and
# ProjectBoard.NUMBER (scripts/utils/ProjectBoard.ts), which a workflow cannot
# import. scripts/__tests__/board-identity.test.ts holds them equal.
name: Project sync

on:
  issues:
    types: [opened, assigned, unassigned]
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_call:
    secrets:
      BOARD_APP_PRIVATE_KEY:
        description: Private key of the smeltworks board GitHub App
        required: true

permissions: {}

concurrency:
  # Serialize writes per item; never cancel one, a half-written status is worse
  # than a slow one.
  group: project-sync-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync board
    runs-on: ubuntu-latest
    env:
      PROJECT_OWNER: smeltworks
      PROJECT_NUMBER: 1
      # A boolean, never the key itself: the steps only ask whether it exists.
      HAS_BOARD_KEY: ${{ secrets.BOARD_APP_PRIVATE_KEY != '' }}
      # `unassigned` fires once per assignee REMOVED. Whether `issue.assignees`
      # is the list BEFORE or AFTER that removal is not documented by GitHub, and
      # the guard below is load-bearing: on the pre-removal list the final
      # unassign would see one name left, take the `exit 0`, and leave the card in
      # WIP while reporting success -- the #1572 symptom, logged as a decision.
      #
      # So do not depend on it. `github.event.assignee` is the user just removed;
      # filtering that name out is correct under EITHER semantics, which is why
      # the two are read separately here.
      #
      # From the payload rather than re-queried: a re-query reads whoever is
      # assigned when it RUNS, which a rapid unassign-then-reassign turns into the
      # wrong answer, and the concurrency group serializes per item, not per event.
      ALL_ASSIGNEES: ${{ join(github.event.issue.assignees.*.login, ',') }}
      REMOVED_ASSIGNEE: ${{ github.event.assignee.login }}
    steps:
      - name: Mint the board token
        id: board-token
        # Pull requests from forks receive no secrets. Skip cleanly rather than
        # failing the run -- a fork PR is added to the board by hand.
        if: env.HAS_BOARD_KEY == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.BOARD_APP_ID }}
          private-key: ${{ secrets.BOARD_APP_PRIVATE_KEY }}
          owner: ${{ env.PROJECT_OWNER }}

      - name: Sync item status
        if: env.HAS_BOARD_KEY == 'true'
        env:
          GH_TOKEN: ${{ steps.board-token.outputs.token }}
        run: |
          set -euo pipefail

          case "${{ github.event_name }}.${{ github.event.action }}" in
            issues.opened)                  TARGET="Grooming";   OVERWRITE="unset" ;;
            issues.assigned)                TARGET="WIP";        OVERWRITE="unset|Grooming|Backlog" ;;
            issues.unassigned)
              # One event per assignee removed: a card someone else is still on is
              # still being worked on, not paused. Dropping the removed name makes
              # this independent of whether the payload list is pre- or
              # post-removal (see ALL_ASSIGNEES above). `|| true` is inside the
              # group so `pipefail` does not see grep's "no lines left" as failure
              # -- that case is exactly the one that must proceed.
              REMAINING=$(printf '%s' "$ALL_ASSIGNEES" | tr ',' '\n' \
                | { grep -vxF "$REMOVED_ASSIGNEE" || true; } | paste -sd, -)
              if [ -n "$REMAINING" ]; then
                echo "Still assigned to ${REMAINING}; leaving status alone."
                exit 0
              fi
              # OVERWRITE="WIP" and nothing else: a card in Grooming, Backlog or
              # Done is not paused work. Those are an ISSUE card's only other
              # statuses -- a pull request gets its OWN card, so PR Review and
              # Changes Needed are unreachable here and are not what this guards.
              TARGET="Backlog";    OVERWRITE="WIP" ;;
            pull_request.opened)            TARGET="PR Review";  OVERWRITE="unset" ;;
            pull_request.reopened)          TARGET="PR Review";  OVERWRITE="any" ;;
            pull_request.ready_for_review)  TARGET="PR Review";  OVERWRITE="unset|Backlog" ;;
            *) echo "No mapping for ${{ github.event_name }}.${{ github.event.action }}"; exit 0 ;;
          esac

          CONTENT_ID="${{ github.event.issue.node_id || github.event.pull_request.node_id }}"

          # One query for the board, its Status field, and every option id. The
          # board is read by its number, so there is no list of boards to page
          # through or truncate (#1416). Its fields are a connection under two
          # singular selections, which --paginate advances like any other
          # (measured, scripts/gh-pagination/GhPagination.ts). Each page arrives
          # as its own JSON document, so the reads below slurp them (jq -s)
          # rather than cut the stream with head, which pipefail would turn
          # into a failure whenever jq is still writing.
          if ! PROJECT_JSON=$(gh api graphql --paginate -f owner="$PROJECT_OWNER" -F number="$PROJECT_NUMBER" -f query='
            query($owner: String!, $number: Int!, $endCursor: String) {
              organization(login: $owner) {
                projectV2(number: $number) {
                  id
                  fields(first: 100, after: $endCursor) {
                    pageInfo { hasNextPage endCursor }
                    nodes {
                      ... on ProjectV2SingleSelectField {
                        id
                        name
                        options { id name }
                      }
                    }
                  }
                }
              }
            }' 2>&1); then
            # GitHub answers a board that does not exist with an error too, so
            # this names every cause rather than guessing one; the response
            # below says which it was.
            echo "::error::Could not read board ${PROJECT_OWNER}/${PROJECT_NUMBER}. Either the board does"
            echo "::error::not exist (npm run project:setup), or the smeltworks board app is not"
            echo "::error::installed, or BOARD_APP_ID / BOARD_APP_PRIVATE_KEY is unset. GitHub said:"
            echo "$PROJECT_JSON"
            exit 1
          fi

          PROJECT_ID=$(jq -rs '[.[].data.organization.projectV2.id // empty][0] // empty' <<<"$PROJECT_JSON")
          if [ -z "$PROJECT_ID" ]; then
            echo "::error::${PROJECT_OWNER} has no project ${PROJECT_NUMBER}. Run: npm run project:setup"
            exit 1
          fi

          STATUS=$(jq -s \
            '[.[].data.organization.projectV2.fields.nodes[] | select(.name == "Status")][0] // empty' \
            <<<"$PROJECT_JSON")
          FIELD_ID=$(jq -r '.id' <<<"$STATUS")
          OPTION_ID=$(jq -r --arg n "$TARGET" \
            '.options[] | select(.name == $n) | .id' <<<"$STATUS")
          if [ -z "$OPTION_ID" ] || [ "$OPTION_ID" = "null" ]; then
            echo "::error::Status has no '$TARGET' option. See docs/WORKFLOW.md."
            exit 1
          fi

          # Adding an item that is already on the board returns the existing one.
          ITEM_ID=$(gh api graphql -f projectId="$PROJECT_ID" -f contentId="$CONTENT_ID" -f query='
            mutation($projectId: ID!, $contentId: ID!) {
              addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                item { id }
              }
            }' --jq '.data.addProjectV2ItemById.item.id')

          CURRENT=$(gh api graphql -f itemId="$ITEM_ID" -f query='
            query($itemId: ID!) {
              node(id: $itemId) {
                ... on ProjectV2Item {
                  fieldValueByName(name: "Status") {
                    ... on ProjectV2ItemFieldSingleSelectValue { name }
                  }
                }
              }
            }' --jq '.data.node.fieldValueByName.name // "unset"')

          # OVERWRITE is a membership test and is indifferent to DIRECTION: it
          # names the statuses a transition may write over, whichever way along
          # the column that lands. Every arm advances a card except
          # issues.unassigned, which is the file's one retreat (WIP -> Backlog,
          # #1572). What the test protects either way is a status someone set by
          # hand -- "Changes Needed" and "Ready to Merge" must survive a reopen
          # or a ready-for-review.
          if [ "$OVERWRITE" != "any" ] && [[ ! "$CURRENT" =~ ^(${OVERWRITE})$ ]]; then
            echo "Leaving ${CONTENT_ID} at '${CURRENT}' (would have set '${TARGET}')."
            exit 0
          fi
          if [ "$CURRENT" = "$TARGET" ]; then
            echo "Already '${TARGET}'."
            exit 0
          fi

          gh api graphql -f projectId="$PROJECT_ID" -f itemId="$ITEM_ID" \
            -f fieldId="$FIELD_ID" -f optionId="$OPTION_ID" -f query='
            mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
              updateProjectV2ItemFieldValue(
                input: {
                  projectId: $projectId
                  itemId: $itemId
                  fieldId: $fieldId
                  value: { singleSelectOptionId: $optionId }
                }
              ) { projectV2Item { id } }
            }' --jq '.data.updateProjectV2ItemFieldValue.projectV2Item.id' >/dev/null

          echo "Set ${CONTENT_ID}: '${CURRENT}' -> '${TARGET}'."
